<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 790" width="800" height="790" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Pong en matriz LED 8x8</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="790" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="94" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">setup: Timer1 cada 100 µs para</tspan><tspan x="260" y="135">refrescar la matriz (doubleBuffer),</tspan><tspan x="260" y="152">pines 2 a 17 como salida, parlante</tspan></text>
<line x1="260" y1="167" x2="260" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="201" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="225">face() muestra la cara y reset()</tspan><tspan x="260" y="242">hace la animación y pone la pelota</tspan><tspan x="260" y="259">en el centro con ángulo 0 o 180</tspan></text>
<line x1="260" y1="274" x2="260" y2="308" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="308" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="332">loop cada 40 ms: calcWall lee A6/A7</tspan><tspan x="260" y="349">y mueve la pared (raqueta)</tspan></text>
<line x1="260" y1="364" x2="260" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,398 425,448.5 260,499 95,448.5" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="432.0">¿se alcanzó la cuenta de</tspan><tspan x="260" y="449.0">velocidad (_count ≥</tspan><tspan x="260" y="466.0">_speed)?</tspan></text>
<text x="268" y="519" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="448.5" x2="480" y2="448.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="442.5" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="420.5" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="444.5">Salir hasta la próxima</tspan><tspan x="590" y="461.5">vuelta</tspan></text>
<line x1="590" y1="476.5" x2="590" y2="500.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="500.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="523.5">Fin</tspan></text>
<line x1="260" y1="499" x2="260" y2="533" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="533" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="557">checkCollision: en cada borde suena</tspan><tspan x="260" y="574">buzz() y, si pega en la raqueta,</tspan><tspan x="260" y="591">retorted(ángulo)</tspan></text>
<line x1="260" y1="606" x2="260" y2="640" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="640" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="664">Si la raqueta falla, reset(); luego</tspan><tspan x="260" y="681">calcAngleIncrement y show()</tspan></text>
<line x1="260" y1="696" x2="260" y2="730" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="730" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="754.5">Fin</tspan></text>
</svg>
