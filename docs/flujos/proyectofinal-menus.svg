<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 758" width="800" height="758" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Consola de menús: potenciómetro y botón</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="758" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="94" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">setup: pantalla ST7735 turquesa,</tspan><tspan x="260" y="135">brillo 80, pines del potenciómetro,</tspan><tspan x="260" y="152">botón y parlante</tspan></text>
<line x1="260" y1="167" x2="260" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="201" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="225">loop() llama a menuPrincipal(): leer</tspan><tspan x="260" y="242">A0 y mapear a la opción resaltada</tspan></text>
<line x1="260" y1="257" x2="260" y2="291" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,291 425,334.0 260,377 95,334.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="326.0">¿botón presionado y no</tspan><tspan x="260" y="343.0">estaba ya presionado?</tspan></text>
<text x="268" y="397" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="334.0" x2="480" y2="334.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="328.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="314.5" width="220" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="338.5">Redibujar y seguir leyendo</tspan></text>
<line x1="590" y1="353.5" x2="590" y2="377.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="377.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="400.5">Fin</tspan></text>
<line x1="260" y1="377" x2="260" y2="411" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="411" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="435">Opción 0 siguiente, 1 Números, 2</tspan><tspan x="260" y="452">Wifi, 3 Brillo; beep de 2 kHz</tspan></text>
<line x1="260" y1="467" x2="260" y2="501" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="501" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="525">Wifi: alternar punto de acceso</tspan><tspan x="260" y="542">«Proyecto ITI»; Brillo: PWM 25, 64,</tspan><tspan x="260" y="559">127, 191 o 225</tspan></text>
<line x1="260" y1="574" x2="260" y2="608" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="608" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="632">«volver» llama a menuPrincipal() de</tspan><tspan x="260" y="649">nuevo (recursión, sin retorno)</tspan></text>
<line x1="260" y1="664" x2="260" y2="698" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="698" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="722.5">Fin</tspan></text>
</svg>
