<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 925" width="800" height="925" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>WakeOnLan: comandos del bot de Telegram</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="925" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="94" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">setup: WiFi estación,</tspan><tspan x="260" y="135">client.setInsecure, longPoll 60 s,</tspan><tspan x="260" y="152">UDP puerto 9</tspan></text>
<line x1="260" y1="167" x2="260" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="201" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="225">loop: cada 1 s bot.getUpdates y</tspan><tspan x="260" y="242">sendSignalToTurnOnOrOff</tspan></text>
<line x1="260" y1="257" x2="260" y2="291" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,291 425,334.0 260,377 95,334.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="326.0">¿llegaron mensajes</tspan><tspan x="260" y="343.0">nuevos?</tspan></text>
<text x="268" y="397" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="334.0" x2="480" y2="334.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="328.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="306.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="330.0">Volver al loop sin hacer</tspan><tspan x="590" y="347.0">nada</tspan></text>
<line x1="590" y1="362.0" x2="590" y2="386.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="386.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="409.0">Fin</tspan></text>
<line x1="260" y1="377" x2="260" y2="411" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,411 425,454.0 260,497 95,454.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="446.0">¿es un callback de botón</tspan><tspan x="260" y="463.0">en línea?</tspan></text>
<text x="268" y="517" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="454.0" x2="480" y2="454.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="448.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="417.5" width="220" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="441.5">Procesar como comando de</tspan><tspan x="590" y="458.5">texto (/start, /wol,</tspan><tspan x="590" y="475.5">/setPC)</tspan></text>
<line x1="590" y1="490.5" x2="590" y2="514.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="514.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="537.5">Fin</tspan></text>
<line x1="260" y1="497" x2="260" y2="531" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,531 425,574.0 260,617 95,574.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="566.0">¿el texto empieza con</tspan><tspan x="260" y="583.0">«WOL»?</tspan></text>
<text x="268" y="637" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="574.0" x2="480" y2="574.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="568.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="554.5" width="220" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="578.5">Revisar si es «Switch»</tspan></text>
<line x1="590" y1="593.5" x2="590" y2="617.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="617.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="640.5">Fin</tspan></text>
<line x1="260" y1="617" x2="260" y2="651" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="651" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="675">WakeOnLan::sendWOL por broadcast</tspan><tspan x="260" y="692">255.255.255.255 a la MAC del</tspan><tspan x="260" y="709">dispositivo elegido</tspan></text>
<line x1="260" y1="724" x2="260" y2="758" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="758" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="782">«Switch»: alternar outputMode; el</tspan><tspan x="260" y="799">pin D1 pasa a OUTPUT por una vuelta</tspan><tspan x="260" y="816">(pulsa el botón de encendido)</tspan></text>
<line x1="260" y1="831" x2="260" y2="865" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="865" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="889.5">Fin</tspan></text>
</svg>
