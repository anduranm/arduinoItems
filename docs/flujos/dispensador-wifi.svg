<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 895" width="800" height="895" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Dispensador: configurar WiFi y punto de acceso</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="895" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,94 420,94 404,167 100,167" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">El usuario abre el panel (puerto</tspan><tspan x="260" y="135">8080); el navegador pide GET</tspan><tspan x="260" y="152">/scan</tspan></text>
<line x1="260" y1="167" x2="260" y2="201" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="201" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="225">WiFi.scanNetworks y lista JSON de</tspan><tspan x="260" y="242">nombres para el selector</tspan></text>
<line x1="260" y1="257" x2="260" y2="291" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="116,291 420,291 404,364 100,364" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="315">Usuario elige la red, escribe</tspan><tspan x="260" y="332">clave y opcionalmente nombre y</tspan><tspan x="260" y="349">clave del AP; POST /connect</tspan></text>
<line x1="260" y1="364" x2="260" y2="398" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,398 425,441.0 260,484 95,441.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="441.5">¿ap_ssid vino vacío?</tspan></text>
<text x="268" y="504" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="441.0" x2="480" y2="441.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="435.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="421.5" width="220" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="445.5">Se usa «Dispensador_AP»</tspan></text>
<line x1="590" y1="460.5" x2="590" y2="484.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="484.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="507.5">Fin</tspan></text>
<line x1="260" y1="484" x2="260" y2="518" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,518 425,561.0 260,604 95,561.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="561.5">¿ap_password vino vacía?</tspan></text>
<text x="268" y="624" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="561.0" x2="480" y2="561.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="555.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="541.5" width="220" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="565.5">Se usa «default»</tspan></text>
<line x1="590" y1="580.5" x2="590" y2="604.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="604.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="627.5">Fin</tspan></text>
<line x1="260" y1="604" x2="260" y2="638" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="638" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="662">Guardar ssid y clave en Preferences</tspan><tspan x="260" y="679">y WiFi.begin con hasta 20 intentos</tspan></text>
<line x1="260" y1="694" x2="260" y2="728" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="728" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="752">Responder 303 hacia / (sin informar</tspan><tspan x="260" y="769">si conectó); la clave del AP nueva</tspan><tspan x="260" y="786">solo se guarda con /configAP</tspan></text>
<line x1="260" y1="801" x2="260" y2="835" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="835" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="859.5">Fin</tspan></text>
</svg>
