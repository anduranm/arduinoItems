<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 835" width="800" height="835" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Estación meteorológica: consulta y pantalla</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="800" height="835" fill="#ffffff"/>
<rect x="185" y="20" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="44.5">Inicio</tspan></text>
<line x1="260" y1="60" x2="260" y2="94" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="94" width="320" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="118">setup: WiFi.begin hasta conectar</tspan><tspan x="260" y="135">(sin tope) y timeClient.begin</tspan></text>
<line x1="260" y1="150" x2="260" y2="184" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,184 425,227.0 260,270 95,227.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="219.0">¿pasaron 10 s desde la</tspan><tspan x="260" y="236.0">última consulta?</tspan></text>
<text x="268" y="290" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="227.0" x2="480" y2="227.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="221.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="199.0" width="220" height="56" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="223.0">No hacer nada en esta</tspan><tspan x="590" y="240.0">vuelta</tspan></text>
<line x1="590" y1="255.0" x2="590" y2="279.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="279.0" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="302.0">Fin</tspan></text>
<line x1="260" y1="270" x2="260" y2="304" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,304 425,347.0 260,390 95,347.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="347.5">¿hay WiFi conectado?</tspan></text>
<text x="268" y="410" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="347.0" x2="480" y2="347.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="341.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="327.5" width="220" height="39" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="351.5">Serial «WiFi Disconnected»</tspan></text>
<line x1="590" y1="366.5" x2="590" y2="390.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="390.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="413.5">Fin</tspan></text>
<line x1="260" y1="390" x2="260" y2="424" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="424" width="320" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="448">GET http://api.openweathermap.org/da</tspan><tspan x="260" y="465">ta/2.5/weather con ciudad, país y</tspan><tspan x="260" y="482">clave en la URL</tspan></text>
<line x1="260" y1="497" x2="260" y2="531" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<polygon points="260,531 425,574.0 260,617 95,574.0" fill="#fef9c3" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="566.0">¿el JSON se pudo</tspan><tspan x="260" y="583.0">interpretar?</tspan></text>
<text x="268" y="637" font-size="12" font-weight="bold" fill="#b45309">Sí</text>
<line x1="425" y1="574.0" x2="480" y2="574.0" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/><text x="431" y="568.0" font-size="12" font-weight="bold" fill="#b45309">No</text>
<rect x="480" y="537.5" width="220" height="73" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="561.5">Serial «Parsing input</tspan><tspan x="590" y="578.5">failed!» y se omite la</tspan><tspan x="590" y="595.5">vuelta</tspan></text>
<line x1="590" y1="610.5" x2="590" y2="634.5" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="545" y="634.5" width="90" height="36" rx="18" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="590" y="657.5">Fin</tspan></text>
<line x1="260" y1="617" x2="260" y2="651" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="100" y="651" width="320" height="90" fill="#ffffff" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="675">Temperatura (K a °C), presión,</tspan><tspan x="260" y="692">humedad, viento y hora NTP; en la</tspan><tspan x="260" y="709">variante con pantalla se dibuja en</tspan><tspan x="260" y="726">la TFT</tspan></text>
<line x1="260" y1="741" x2="260" y2="775" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="185" y="775" width="150" height="40" rx="20" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/><text text-anchor="middle" font-size="13" fill="#1f2937"><tspan x="260" y="799.5">Fin</tspan></text>
</svg>
